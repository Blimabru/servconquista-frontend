server {
    # O Nginx vai escutar requisições na porta 80
    listen 80;
    server_name localhost;

    # Pasta onde os arquivos do frontend compilado estão armazenados
    root /usr/share/nginx/html;
    
    # Arquivo principal que o Nginx tentará carregar
    index index.html;

    # ==========================================================================
    # REGRA DE ROTEAMENTO PARA SINGLE PAGE APPLICATIONS (SPA)
    # ==========================================================================
    # O index.html nunca deve ser cacheado pelo navegador para garantir que
    # após novos deploys o usuário sempre carregue os hashes mais recentes dos bundles.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Arquivos com hash na pasta /assets/ podem ser cacheados por longo período
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ==========================================================================
    # TRATAMENTO DE ERROS DO SERVIDOR
    # ==========================================================================
    # Se o servidor Nginx encontrar uma falha interna (Erro 500, etc), ele exibirá
    # uma página padrão amigável (50x.html).
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
