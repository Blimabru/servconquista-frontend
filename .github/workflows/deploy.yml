name: Deploy Frontend to Oracle VM

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Criar arquivo .env para o build
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            cat > .env << 'EOF'
          APP_NAME="ServConquista"
          VERSION=1.0.0
          PORT=8080
          PROTOCOL=https
          BASE_URL=https://servconquista.brainstormlabs.online/
          API_BASE_URL=https://servconquista.brainstormlabs.online/api/
          EOF
          else
            cat > .env << 'EOF'
          APP_NAME="ServConquista [HML]"
          VERSION=1.0.0
          PORT=8080
          PROTOCOL=https
          BASE_URL=https://hml-servconquista.brainstormlabs.online/
          API_BASE_URL=https://hml-servconquista.brainstormlabs.online/api/
          EOF
          fi

      - name: Instalar Quasar CLI globalmente
        run: npm install -g @quasar/cli

      - name: Install Dependencies and Build (Native AMD64)
        run: |
          npm install
          NODE_OPTIONS=--max-old-space-size=4096 quasar build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU para ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            if [ "${{ github.ref_name }}" = "main" ]; then
              STACK_DIR="/srv/stacks/conquistaserv/conquistaserv-prod"
              mkdir -p "$STACK_DIR"
              cd "$STACK_DIR"

              cat > docker-compose.yml << 'EOF'
            name: conquistaserv
            services:
              backend:
                image: ghcr.io/blimabru/servconquista-backend:main
                container_name: conquistaserv_backend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                  - ./uploads:/app/uploads
                environment:
                  - TZ=America/Bahia
                  - NODE_ENV=production
                  - DATABASE_URL=${DATABASE_URL}
                  - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
                  - ACCESS_TOKEN_EXPIRATION=86400s
                  - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
                  - REFRESH_TOKEN_EXPIRATION=604800s
                  - HTTP_PORT=3006
                  - APP_HOSTNAME=servconquista.brainstormlabs.online
                  - APP_NAME=conquistaserv-backend
                  - OPENAI_API_KEY=${OPENAI_API_KEY}
                  - AI_MODEL_NAME=${AI_MODEL_NAME}
                  - AI_TEMPERATURE=${AI_TEMPERATURE}
                  - AI_CHUNK_SIZE=${AI_CHUNK_SIZE}
                  - AI_CHUNK_OVERLAP=${AI_CHUNK_OVERLAP}
                  - AI_DOCS_PATH=${AI_DOCS_PATH}
                  - AI_SYSTEM_PROMPT_PATH=${AI_SYSTEM_PROMPT_PATH}
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

              frontend:
                image: ghcr.io/blimabru/servconquista-frontend:main
                container_name: conquistaserv_frontend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                environment:
                  - TZ=America/Bahia
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            networks:
              global-network:
                external: true
            EOF
              sed -i 's/^            //' docker-compose.yml

            elif [ "${{ github.ref_name }}" = "develop" ]; then
              STACK_DIR="/srv/stacks/conquistaserv/conquistaserv-hml"
              mkdir -p "$STACK_DIR"
              cd "$STACK_DIR"

              cat > docker-compose.yml << 'EOF'
            name: conquistaserv-hml
            services:
              backend:
                image: ghcr.io/blimabru/servconquista-backend:develop
                container_name: conquistaserv_hml_backend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                  - ./uploads:/app/uploads
                environment:
                  - TZ=America/Bahia
                  - NODE_ENV=production
                  - DATABASE_URL=${DATABASE_URL}
                  - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
                  - ACCESS_TOKEN_EXPIRATION=86400s
                  - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
                  - REFRESH_TOKEN_EXPIRATION=604800s
                  - HTTP_PORT=3006
                  - APP_HOSTNAME=hml-servconquista.brainstormlabs.online
                  - APP_NAME=conquistaserv-backend-hml
                  - OPENAI_API_KEY=${OPENAI_API_KEY}
                  - AI_MODEL_NAME=${AI_MODEL_NAME}
                  - AI_TEMPERATURE=${AI_TEMPERATURE}
                  - AI_CHUNK_SIZE=${AI_CHUNK_SIZE}
                  - AI_CHUNK_OVERLAP=${AI_CHUNK_OVERLAP}
                  - AI_DOCS_PATH=${AI_DOCS_PATH}
                  - AI_SYSTEM_PROMPT_PATH=${AI_SYSTEM_PROMPT_PATH}
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

              frontend:
                image: ghcr.io/blimabru/servconquista-frontend:develop
                container_name: conquistaserv_hml_frontend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                environment:
                  - TZ=America/Bahia
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            networks:
              global-network:
                external: true
            EOF
              sed -i 's/^            //' docker-compose.yml
            fi

            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -af
